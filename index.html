<!DOCTYPE html>
<html>

<head>
  <title>Проект "Комменты"</title>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="container">
    <ul class="comments"></ul>

    <div class="add-form">
      <input type="text" class="add-form-name" placeholder="Введите ваше имя" />
      <textarea class="add-form-text" placeholder="Введите ваш комментарий" rows="4"></textarea>
      <div class="add-form-row">
        <button class="add-form-button">Написать</button>
        <button type="button" class="cancel-reply-button" style="display:none;">Отмена ответа</button>
      </div>
    </div>
  </div>
</body>

<script>
  "use strict";

  // 1. ДАННЫЕ
  const commentsData = [
    {
      id: 1,
      name: "Алексей",
      text: "Отличная статья, спасибо!",
      date: "10.10.2023 14:30",
      likesCount: 5,
      isLiked: false,
      parentId: null
    },
    {
      id: 2,
      name: "Мария",
      text: "Не очень понятно про второй пункт.",
      date: "10.10.2023 15:15",
      likesCount: 2,
      isLiked: true,
      parentId: null
    }
  ];

  // 2. ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
  function escapeHtml(str) {
    if (!str) return "";
    return str
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function formatReplyQuote(name, text) {
    const escapedName = escapeHtml(name);
    const escapedText = escapeHtml(text);
    return `> ${escapedName}: ${escapedText}\n\n`;
  }

  // 3. ФУНКЦИЯ ОТРИСОВКИ
  function renderComments() {
    const commentsList = document.querySelector(".comments");
    if (!commentsList) return;

    commentsList.innerHTML = "";

    commentsData.forEach(comment => {
      const heartClass = comment.isLiked ? "liked" : "";
      const isReply = comment.parentId !== null;

      const li = document.createElement("li");
      li.className = "comment";
      li.dataset.id = comment.id;

      li.innerHTML = `
        <div class="comment-header">
          <div>${escapeHtml(comment.name)}</div>
          <div>${comment.date}</div>
        </div>
        <div class="comment-body">
          <div class="comment-text">
            ${escapeHtml(comment.text)}
          </div>
        </div>
        <div class="comment-footer">
          <div class="likes">
            <button class="like-button ${activeClass}" data-id="${comment.id}"></button>
            <span class="likes-counter">${comment.likesCount}</span>
          </div>
        </div>
      `;

      commentsList.appendChild(li);
    });
  }

  // 4. ОБРАБОТЧИК ЛАЙКОВ (делегирование событий)
 document.querySelector(".comments").addEventListener("click", (event) => {
    const target = event.target.closest(".like-button");

    if (!target) return; // Клик был не по кнопке лайка

    const commentId = parseInt(target.dataset.id, 10);
    const comment = commentsData.find(c => c.id === commentId);

    if (!comment) return;

    comment.isLiked = !comment.isLiked;
    comment.likesCount += comment.isLiked ? 1 : -1;

    renderComments();
  });

  // 5. ОБРАБОТЧИК КНОПКИ "НАПИСАТЬ"
  document.querySelector(".comments").addEventListener("click", (event) => {

    const card = event.target.closest(".comment");
    if (!card) return;

    const isLikeButton = event.target.closest(".like-button");
    if (isLikeButton) {
      return;
    }

    const commentId = parseInt(card.dataset.id, 10);
    const comment = commentsData.find(c => c.id === commentId);
    if (!comment) return;

    startReply(comment);
  });

  function startReply(comment) {
    const nameInput = document.querySelector(".add-form-name");
    const textInput = document.querySelector(".add-form-text");
    const cancelBtn = document.querySelector(".cancel-reply-button");

    const quote = formatReplyQuote(comment.name, comment.text);

    textInput.value = quote;
       // Сохраняем ID родителя в data-reply-to
    textInput.dataset.replyTo = comment.id;
    // Показываем кнопку «Отмена ответа»
    cancelBtn.style.display = "inline-block";
  }
  // Кнопка «Отмена ответа»
  document.querySelector(".cancel-reply-button").addEventListener("click", () => {
    const textInput = document.querySelector(".add-form-text");
    const cancelBtn = document.querySelector(".cancel-reply-button");

    textInput.value = "";
    textInput.dataset.replyTo = "";
    cancelBtn.style.display = "none";
  });

  // 6. ОБРАБОТЧИК КНОПКИ «НАПИСАТЬ»
  const nameInput = document.querySelector(".add-form-name");
  const commentInput = document.querySelector(".add-form-text");
  const addBtn = document.querySelector(".add-form-button");

  addBtn.addEventListener("click", () => {
    const name = nameInput.value.trim();
    const text = commentInput.value.trim();

    if (!name || !text) {
      alert("Пожалуйста, заполните и имя, и комментарий.");
      return;
    }

    const now = new Date();
    const day = String(now.getDate()).padStart(2, "0");
    const month = String(now.getMonth() + 1).padStart(2, "0");
    const year = now.getFullYear().toString().slice(-2);
    const hours = String(now.getHours()).padStart(2, "0");
    const minutes = String(now.getMinutes()).padStart(2, "0");

    const dateString = `${day}.${month}.${year} ${hours}:${minutes}`;

    // parentId — это ID комментария, на который мы отвечаем (если есть)
    const parentId = commentInput.dataset.replyTo
      ? parseInt(commentInput.dataset.replyTo, 10)
      : null;

    const newComment = {
      id: Date.now(),
      name: name,
      text: text,
      date: dateString,
      likesCount: 0,
      isLiked: false,
      parentId: parentId
    };

    commentsData.unshift(newComment);

    nameInput.value = "";
    commentInput.value = "";
    commentInput.dataset.replyTo = "";

    // Скрываем кнопку «Отмена ответа» после отправки
    document.querySelector(".cancel-reply-button").style.display = "none";

    renderComments();
  });

  // 7. ЗАПУСК ПРИ ЗАГРУЗКЕ
  renderComments();
</script>

</html>
