<!DOCTYPE html>
<html>

<head>
  <title>Проект "Комменты"</title>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="container">
    <ul class="comments"></ul>

    <div class="add-form">
      <input type="text" class="add-form-name" placeholder="Введите ваше имя" />
      <textarea class="add-form-text" placeholder="Введите ваш комментарий" rows="4"></textarea>
      <div class="add-form-row">
        <button class="add-form-button">Написать</button>
      </div>
    </div>
  </div>
</body>

<script>
  "use strict";

  // 1. ДАННЫЕ
  const commentsData = [
    {
      id: 1,
      name: "Алексей",
      text: "Отличная статья, спасибо!",
      date: "10.10.2023 14:30",
      likesCount: 5,
      isLiked: false
    },
    {
      id: 2,
      name: "Мария",
      text: "Не очень понятно про второй пункт.",
      date: "10.10.2023 15:15",
      likesCount: 2,
      isLiked: true
    }
  ];

  // 2. ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
  function escapeHtml(str) {
    return str
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  // 3. ФУНКЦИЯ ОТРИСОВКИ
  function renderComments() {
    const commentsList = document.querySelector(".comments");
    if (!commentsList) return;

    commentsList.innerHTML = "";

    commentsData.forEach(comment => {
      const heartClass = comment.isLiked ? "liked" : "";

      const li = document.createElement("li");
      li.className = "comment";

      li.innerHTML = `
      <div class="comment-header">
        <div>${escapeHtml(comment.name)}</div>
        <div>${comment.date}</div>
      </div>
      <div class="comment-body">
        <div class="comment-text">
          ${escapeHtml(comment.text)}
        </div>
      </div>
      <div class="comment-footer">
        <div class="likes">
          <!-- data-id нужен, чтобы найти комментарий в массиве -->
          <button class="like-button ${heartClass}" data-id="${comment.id}">
            <!-- Добавил эмодзи ♡ как контент, чтобы точно было видно сердечко -->
            <span class="icon-heart">♡</span>
          </button>
          <span class="likes-counter">${comment.likesCount}</span>
        </div>
      </div>
    `;

      commentsList.appendChild(li);
    });
  }

  // 4. ОБРАБОТЧИК ЛАЙКОВ (делегирование событий)
  document.querySelector(".comments").addEventListener("click", (event) => {
    const target = event.target.closest(".like-button");

    if (!target) return; // Клик был не по кнопке

    const commentId = parseInt(target.dataset.id, 10);
    const comment = commentsData.find(c => c.id === commentId);

    if (!comment) return;

    // Меняем данные В МАССИВЕ
    if (comment.isLiked) {
      comment.isLiked = false;
      comment.likesCount--;
    } else {
      comment.isLiked = true;
      comment.likesCount++;
    }

    // Перерисовываем список
    renderComments();
  });

  // 5. ОБРАБОТЧИК КНОПКИ "НАПИСАТЬ"
  const nameInput = document.querySelector(".add-form-name");
  const commentInput = document.querySelector(".add-form-text");
  const addBtn = document.querySelector(".add-form-button");

  addBtn.addEventListener("click", () => {
    const name = nameInput.value.trim();
    const text = commentInput.value.trim();

    if (!name || !text) {
      alert("Пожалуйста, заполните и имя, и комментарий.");
      return;
    }

    const now = new Date();
    const day = String(now.getDate()).padStart(2, "0");
    const month = String(now.getMonth() + 1).padStart(2, "0");
    const year = now.getFullYear().toString().slice(-2);
    const hours = String(now.getHours()).padStart(2, "0");
    const minutes = String(now.getMinutes()).padStart(2, "0");

    const dateString = `${day}.${month}.${year} ${hours}:${minutes}`;

    const newComment = {
      id: Date.now(),
      name: name,
      text: text,
      date: dateString,
      likesCount: 0,
      isLiked: false
    };

    commentsData.unshift(newComment);

    nameInput.value = "";
    commentInput.value = "";

    renderComments(); // Обновляем список
  });

  // 6. ЗАПУСК ПРИ ЗАГРУЗКЕ
  renderComments();
</script>

</html>
