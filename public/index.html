<!DOCTYPE html>
<html>
  <head>
    <title>Проект "Комменты"</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
<div class="container">
  <div id="app"></div>
  <ul class="comments">
    <li class="comment">
      <div class="comment-header">
        <span>Глеб Фокин</span>
        <span>20.03.2023 12:41:33</span>
      </div>
      <div class="comment-body">
        <div class="comment-text">Это мой первый лайк</div>
      </div>
      <div class="comment-footer">
        <div class="likes">
          <span class="likes-counter">0</span>
          <button type="button" class="like-button" aria-label="Лайк"></button>
        </div>
      </div>
    </li>
  </ul>

  <form class="add-form" id="commentForm">
    <input 
      type="text" 
      class="add-form-name" 
      placeholder="Введите ваше имя" 
      required
    >
    <textarea 
      class="add-form-text" 
      placeholder="Введите ваш комментарий" 
      rows="4"
      required
    ></textarea>
    <button type="submit" class="add-form-button">Написать</button>
  </form>
</div>
    <script type="module" src="./index.js"></script>
  </body>
</html>
